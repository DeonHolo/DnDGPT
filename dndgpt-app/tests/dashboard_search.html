<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard search checks</title><style>body{background:#121711;color:#eee8db;font:15px/1.6 system-ui;margin:20px}iframe{width:1100px;height:850px;border:1px solid #99865b}.pass{color:#b7d89b}.fail{color:#ffaaa2}button{padding:12px}</style>
<h1>Dashboard search checks</h1><p>Disposable renderer fixtures. Typing must stay local.</p><button id="run">Run checks</button><p id="result">Ready</p><ol id="results"></ol><iframe id="widget" src="/test-widget" title="Search fixture"></iframe>
<script>
const frame=document.getElementById('widget'),results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));let toolCalls=0;
const assert=(v,m)=>{if(!v)throw Error(m)};
async function until(fn){for(let i=0;i<100;i++){if(fn())return;await wait(70)}throw Error('Timed out waiting for UI')}
async function call(name,args){toolCalls++;const response=await fetch('/test-rpc',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:toolCalls,method:'tools/call',params:{name,arguments:args}})});const body=await response.json();if(body.error)throw Error(body.error.message);return body.result}
window.addEventListener('message',async event=>{if(event.source!==frame.contentWindow||!event.data?.id)return;const m=event.data;let result={};if(m.method==='ui/initialize')result={protocolVersion:'2026-01-26',hostInfo:{name:'Local search fixture',version:'1'},hostCapabilities:{serverTools:{},message:{text:{}}},hostContext:{displayMode:'fullscreen'}};else if(m.method==='tools/call')result=await call(m.params.name,m.params.arguments);event.source.postMessage({jsonrpc:'2.0',id:m.id,result},'*')});
async function test(name,fn){try{await fn();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}const li=document.createElement('li');li.className=results.at(-1).passed?'pass':'fail';li.textContent=JSON.stringify(results.at(-1));document.getElementById('results').append(li)}
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;let w=frame.contentWindow,d=frame.contentDocument;
 await until(()=>d.getElementById('session')?.options.length>1);
 const before=await(await fetch('/test-state')).json(),fixture=structuredClone(before.campaign);fixture.version+=8000;fixture.mode='chat';fixture.phase='adventure';fixture.name='Search sample';
 fixture.abilities=[{id:'cinder',name:'Cinder Lance',activation:'Active',rarity:'RARE',simple:'A burning spear.',mechanics_display:'Strike a visible target with fire.',upgrades:[{id:'splinter',name:'Splintering Crown',change_display:'The lanternfish mark spreads on impact.'}]},{id:'moss',name:'Moss Memory',activation:'Passive',rarity:'UNCOMMON',mechanics_display:'Recognize a silvermoth trail.'},{id:'pillar',name:'Pillar Way',activation:'Active',group:'Exploration & Utility',rarity:'RARE',mechanics_display:'Cross a sinkhole on a stone path.'},{id:'hidden',name:'SECRET_POWER_CANARY',known_to_player:false}];
 for(let i=0;i<52;i++)fixture.abilities.push({id:'archive-'+i,name:'Archive technique '+i,activation:'Active',mechanics_display:'Recorded ember study '+i});
 fixture.character.story_summary='A cartographer searching for a missing coast.';
 fixture.inventory=[{id:'map',name:'Folded Map',description:'A chart with a bluewater inlet.'}];fixture.equipment={'Ring 1':{id:'ring',name:'Dawn Signet',rarity:'LEGENDARY',effects:'The opal seal glows near running water.'}};
 fixture.quest_log=[{id:'archived',name:'Repair the Ferry',status:'completed',quest_schema:1,description:'The rivermender returns to work.',objectives:[{id:'rope',text:'Replace the tether',status:'done'}]},{id:'hidden',name:'SECRET_QUEST_CANARY',known_to_player:false}];
 fixture.world={history:'A starfall joined the coast to Earth.',lore:{description:'The west bank has a moonharbor.',gm_notes:'SECRET_WORLD_CANARY'},private_map:'SECRET_MAP_CANARY'};
 fixture.world_log=Array.from({length:19},(_,i)=>({id:'entry-'+i,text:i===0?'An amberglass promise was made at the ferry.':'The caravan reached mile '+i}));fixture.world_log.push({id:'secret-log',text:'SECRET_LOG_CANARY',known_to_player:false});
 const receive=value=>w.receive({structuredContent:{campaign:value}});
 const query=value=>{const input=d.getElementById('dashboardSearch');input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));return [...d.querySelectorAll('#dashboardSearchList button')]};
 const open=(value,title)=>{const rows=query(value),row=title?rows.find(b=>b.querySelector('strong').textContent===title):rows[0];assert(row,'Missing result: '+value);row.click();return d.querySelector('[data-search-highlight]')};
 receive(fixture);await wait(150);
 await test('typing performs no tool calls and matches words case-insensitively',async()=>{const count=toolCalls;const rows=query('CINDER lance');assert(rows.some(b=>b.textContent.includes('Cinder Lance')),'Title match missing');query('opal water');query('no-matching-entry');await wait(120);assert(toolCalls===count,'Typing called the server');assert(d.getElementById('dashboardSearchCount').textContent.includes('No matches'),'Empty state missing')});
 await test('ability result opens its rules and dependent upgrade opens parent Upgrades',async()=>{let target=open('silvermoth');assert(d.getElementById('skill-tab-passives').getAttribute('aria-selected')==='true','Wrong skill category');assert(target.textContent.includes('silvermoth')&&target.getClientRects().length,'Passive rules not revealed');target=open('lanternfish','Splintering Crown');assert(d.getElementById('ability-view-upgrades-cinder').getAttribute('aria-selected')==='true','Parent Upgrades not selected');assert(target.textContent.includes('lanternfish')&&target.getClientRects().length,'Upgrade not visible')});
 await test('equipment and inventory matches open the correct collapsed entry',async()=>{for(const [word,page]of [['opal','equipment'],['bluewater','inventory']]){const target=open(word);assert(target.textContent.includes(word)&&target.getClientRects().length,'Item not exposed');assert(d.getElementById('tab-'+page).getAttribute('aria-selected')==='true','Wrong equipment subtab')}});
 await test('completed quest opens archive and older log entry opens beyond first page',async()=>{let target=open('rivermender');assert(target.textContent.includes('rivermender')&&target.getClientRects().length,'Archived quest hidden');target=open('amberglass');assert(target.textContent.includes('amberglass')&&target.getClientRects().length,'Older log hidden');assert(d.getElementById('world-tab-log').getAttribute('aria-selected')==='true','Wrong world tab')});
 await test('world article navigation and character story reveal the match',async()=>{let target=open('moonharbor');assert(target.textContent.includes('moonharbor')&&target.getClientRects().length,'World article not shown');target=open('cartographer');assert(target.textContent.includes('cartographer')&&target.getClientRects().length,'Collapsed story not opened')});
 await test('hidden records, private fields and HTML queries remain safe',async()=>{for(const word of ['SECRET_POWER_CANARY','SECRET_QUEST_CANARY','SECRET_WORLD_CANARY','SECRET_MAP_CANARY','SECRET_LOG_CANARY'])assert(query(word).length===0,'Private result leaked: '+word);query('<img src=x onerror=alert(1)>');assert(!d.querySelector('#dashboardSearchList img'),'Query interpreted as HTML')});
 await test('large results paginate locally',async()=>{const count=toolCalls;assert(query('Archive technique').length===40,'Initial result limit missing');d.getElementById('dashboardSearchMore').click();assert(d.querySelectorAll('#dashboardSearchList button').length===52,'Remaining results missing');assert(toolCalls===count,'More results fetched server data')});
 await test('keyboard moves through results and Escape closes without reopening',async()=>{query('Archive technique');const input=d.getElementById('dashboardSearch');input.focus();input.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));assert(d.activeElement===d.querySelector('#dashboardSearchList button'),'ArrowDown did not focus results');d.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));assert(d.activeElement===d.querySelectorAll('#dashboardSearchList button')[1],'Next result inaccessible');d.activeElement.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert(d.activeElement===input&&d.getElementById('dashboardSearchResults').hidden,'Escape reopened the list');d.getElementById('dashboardSearchClear').click();assert(!input.value&&d.getElementById('dashboardSearchResults').hidden,'Clear did not reset results')});
 await test('loaded Gallery labels can be searched and reopened',async()=>{d.getElementById('nav-gallery').click();await until(()=>d.getElementById('galleryGrid').textContent.includes('At the woodland crossing'));const target=open('woodland','At the woodland crossing');assert(target.getClientRects().length,'Gallery result hidden');assert(d.getElementById('nav-gallery').getAttribute('aria-current')==='page','Gallery not selected')});
 for(const width of [390,1100])for(const layout of ['original','reclaimed','orrery','ember'])await test(layout+' at '+width+': results and revealed utility fit',async()=>{frame.style.width=width+'px';w.selectLayout(layout,false);query('sinkhole');await wait(70);for(const node of [d.getElementById('dashboardSearch'),...d.querySelectorAll('#dashboardSearchList button')]){const rect=node.getBoundingClientRect();assert(rect.width>0&&rect.left>=-1&&rect.right<=d.documentElement.clientWidth+1,'Search control clipped')}const target=open('sinkhole');assert(target.getClientRects().length&&d.getElementById('skill-tab-utility').getAttribute('aria-selected')==='true','Utility result missing');assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth+2,'Horizontal overflow')});
 await test('campaign changes clear the query and old index',async()=>{query('lanternfish');const next=structuredClone(fixture);next.id='other-disposable-campaign';next.abilities=[];next.inventory=[];next.equipment={};next.quest_log=[];next.world={};next.world_log=[];next.character.story_summary='A different journey.';receive(next);assert(!d.getElementById('dashboardSearch').value,'Previous query retained');assert(query('lanternfish').length===0,'Other campaign result leaked')});
 await test('Sovereign foundation upgrade opens its entity inspector',async()=>{await fetch('/test-sovereign-fixture',{method:'POST'});const sovereign=(await(await fetch('/test-sovereign-state')).json());sovereign.version+=8000;receive(sovereign);const target=open('Domain growth');assert(target.getClientRects().length,'Foundation upgrade hidden');assert(d.getElementById('nav-sovereignty').getAttribute('aria-current')==='page','Sovereignty not selected');assert(target.closest('[id^="ability-copy-upgrades-"]'),'Wrong foundation view')});
 receive(fixture);frame.style.width='1100px';w.selectLayout('original',false);query('lanternfish');
 const report={passed:results.every(row=>row.passed),checks:results,toolCalls,environment:'Local in-app Chromium; disposable renderer fixtures, not ChatGPT'};document.getElementById('result').textContent=(report.passed?'PASS':'FAIL')+' · '+results.filter(r=>r.passed).length+'/'+results.length;await fetch('/test-search-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});
};
if(location.search.includes('preview')){document.documentElement.classList.add('preview');const style=document.createElement('style');style.textContent='.preview body{margin:0}.preview body>:not(iframe):not(script){display:none}.preview iframe{border:0}';document.head.append(style)}
if(location.search.includes('autorun'))window.addEventListener('load',()=>document.getElementById('run').click());
</script></html>

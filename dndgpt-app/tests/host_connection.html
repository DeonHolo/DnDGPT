<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard host connection checks</title>
<style>body{background:#121711;color:#eee8db;font:15px/1.6 system-ui;margin:20px}iframe{display:block;width:1100px;height:900px;border:1px solid #99865b}.pass{color:#b7d89b}.fail{color:#ffaaa2}button{padding:12px}</style>
<h1>Dashboard host connection checks</h1><p>Disposable save. Real authenticated MCP. Modern, hybrid and compatibility hosts.</p>
<button id="run">Run checks</button><p id="result" role="status">Ready</p><ol id="results"></ol><iframe id="widget" title="Dashboard connection fixture"></iframe>
<script>
const frame=document.getElementById('widget'),results=[],wait=ms=>new Promise(r=>setTimeout(r,ms));
let scenario='hybrid',initialized=0,initRequests=0,fixture,loadedAt=0,readyAt=0,initAt=0,calls=[],rpcId=100;
const assert=(ok,message)=>{if(!ok)throw Error(message)};
async function until(fn,message,limit=5000){const deadline=performance.now()+limit;while(performance.now()<deadline){if(fn())return;await wait(30)}throw Error(message)}
async function test(name,fn){try{await fn();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}const li=document.createElement('li');li.className=results.at(-1).passed?'pass':'fail';li.textContent=JSON.stringify(results.at(-1));document.getElementById('results').append(li)}
async function call(name,args){calls.push(name);const response=await fetch('/test-rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:++rpcId,method:'tools/call',params:{name,arguments:args}})});const data=await response.json();if(data.error)throw Error(data.error.message);return data.result}
function send(result){frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:result},'*')}
window.addEventListener('message',async event=>{
 if(event.source!==frame.contentWindow||event.data?.jsonrpc!=='2.0')return;const m=event.data;
 if(m.method==='ui/initialize'){initRequests++;initAt=performance.now();if(['legacy','late'].includes(scenario))return;const reply=()=>event.source.postMessage({jsonrpc:'2.0',id:m.id,result:{protocolVersion:'2026-01-26',hostInfo:{name:'Connection regression host',version:'1'},hostCapabilities:{serverTools:{},message:{text:{}}},hostContext:{displayMode:'inline'}}},'*');if(scenario==='slow')setTimeout(reply,1200);else reply();return}
 if(m.method==='ui/notifications/initialized'){initialized++;window.connectionHostReady=true;readyAt=performance.now();send({structuredContent:{game_id:'sovereign-system',campaign:fixture.campaign}});return}
 if(m.id===undefined)return;let result={};
 if(m.method==='tools/call'){assert(initialized>0,'Modern host rejected a tool call before readiness');result=await call(m.params.name,m.params.arguments)}
 event.source.postMessage({jsonrpc:'2.0',id:m.id,result},'*');
});
async function load(mode,partial=false){scenario=mode;initialized=0;window.connectionHostReady=false;initRequests=0;readyAt=0;calls=[];loadedAt=performance.now();frame.src=mode==='standard'||mode==='late'?'/test-widget?connection='+mode:'/test-legacy-widget?neutral=true&partial='+partial+'&strict='+(mode==='slow');await new Promise(resolve=>frame.onload=resolve);return frame.contentDocument}
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;
 try{fixture=await(await fetch('/test-laws-fixture',{method:'POST'})).json();assert(fixture.campaign,'Could not prepare disposable campaign');
 await test('Hybrid host receives initialization and readiness within its five-second deadline',async()=>{await load('hybrid');await until(()=>initialized===1,'Host never received ui/notifications/initialized');assert(initRequests===1&&readyAt-loadedAt<5000,'Initialization was late or duplicated');await until(()=>frame.contentDocument.getElementById('hero')?.textContent.includes('The Still Guest'),'Initial tool result never rendered')});
 await test('Partial persisted preferences cannot prevent host readiness or render',async()=>{await load('hybrid',true);await until(()=>initialized===1,'Partial preferences crashed initialization');await until(()=>frame.contentDocument.getElementById('hero')?.textContent.includes('The Still Guest'),'Partial preferences blocked the saved state')});
 await test('Standard-only host connects and receives saved state',async()=>{await load('standard');await until(()=>initialized===1,'Standard host did not initialize');await until(()=>frame.contentDocument.getElementById('hero')?.textContent.includes('The Still Guest'),'Standard state missing')});
 await test('A delayed modern handshake recovers an early rejected compatibility read',async()=>{await load('slow');await until(()=>initialized===1,'Delayed handshake never completed');await until(()=>frame.contentDocument.getElementById('hero')?.textContent.includes('The Still Guest'),'Connection did not recover after readiness');assert(frame.contentWindow.legacyCalls.length<=1,'Repeated compatibility reads');assert(readyAt-loadedAt<5000,'Host readiness deadline missed')});
 await test('Compatibility-only host starts without waiting fifteen seconds for standard RPC',async()=>{await load('legacy');await until(()=>frame.contentWindow.legacyCalls?.length>0,'Compatibility tools were delayed',3000);assert(performance.now()-loadedAt<3000,'Legacy startup waited for the full RPC timeout');assert(initRequests===1,'Standard handshake was skipped');await frame.contentWindow.callTool('get_campaign',{campaign_id:fixture.campaign.id})});
 await test('Late compatibility bridge recovers the same mounted dashboard',async()=>{await load('late');const w=frame.contentWindow,d=frame.contentDocument;w.openai={widgetState:{},callTool:call,setWidgetState:value=>{w.openai.widgetState=value}};w.dispatchEvent(new CustomEvent('openai:set_globals',{detail:{globals:{toolOutput:{game_id:'sovereign-system',campaign:fixture.campaign},displayMode:'inline'}}}));await until(()=>d.getElementById('hero')?.textContent.includes('The Still Guest'),'Late bridge failed to recover');assert(frame.contentDocument===d,'Late bridge remounted the view')});
 await test('A real save updates the mounted dashboard through a tool-result notification',async()=>{await load('hybrid');await until(()=>initialized===1&&frame.contentDocument.getElementById('hero')?.textContent.includes('The Still Guest'),'Hybrid setup failed');const d=frame.contentDocument,count=initialized,current=fixture.campaign;const changed=await call('save_chat_update',{campaign_id:current.id,action_id:'connection-notify-'+crypto.randomUUID(),expected_version:current.version,summary:'Disposable connection update',changes:{current_location:'The far-bank reflection'}});assert(!changed.isError,JSON.stringify(changed));fixture.campaign=changed.structuredContent.campaign;send(changed);await until(()=>d.getElementById('location').textContent==='The far-bank reflection','Committed update did not render');assert(frame.contentDocument===d&&initialized===count,'Save remounted the dashboard')});
 await test('Mounted refresh retrieves the next real version without opening another component',async()=>{const w=frame.contentWindow,d=frame.contentDocument,count=initialized,current=fixture.campaign;const changed=await call('save_chat_update',{campaign_id:current.id,action_id:'connection-refresh-'+crypto.randomUUID(),expected_version:current.version,summary:'Disposable refresh update',changes:{current_location:'The river stair'}});assert(!changed.isError,JSON.stringify(changed));fixture.campaign=changed.structuredContent.campaign;const before=calls.length;await w.refresh();await until(()=>d.getElementById('location').textContent==='The river stair','Refresh did not retrieve committed state');assert(!calls.slice(before).includes('render_dashboard'),'Mounted refresh reopened dashboard');assert(frame.contentDocument===d&&initialized===count,'Refresh remounted dashboard')});
 }catch(e){results.push({name:'Setup',passed:false,error:e.message})}
 const report={passed:results.every(r=>r.passed),results,environment:'In-app browser, real authenticated local MCP, disposable save',production_campaign_writes:0};document.getElementById('result').textContent=report.passed?'All '+results.length+' checks passed':'Failed: '+JSON.stringify(results.filter(r=>!r.passed));await fetch('/test-host-connection-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});document.getElementById('run').disabled=false;
};
if(location.search.includes('autorun'))document.getElementById('run').click();
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D&D character sheet · local acceptance</title>
<style>body{margin:16px;background:#20231f;color:#f5f1e7;font:15px/1.5 system-ui}h1{font:24px Georgia,serif}button,select{min-height:44px;padding:8px 16px}iframe{display:block;width:100%;height:950px;border:1px solid #797369;margin:16px 0}#results{white-space:pre-wrap}.pass{color:#8ce0aa}.fail{color:#ff9b98}.controls{display:flex;flex-wrap:wrap;gap:8px}</style>
<h1>D&D 2024 character sheet</h1><p>Local preview with disposable character and adventure fixtures.</p>
<div class="controls"><button id="run">Run checks</button><label>Preview width <select id="width"><option value="100%">Full width</option><option value="768px">768px</option><option value="375px">375px</option></select></label><label>Layout <select id="layout"><option value="original">Original</option><option value="reclaimed">Reclaimed Codex</option><option value="orrery">The Orrery</option><option value="ember">Ember Ledger</option></select></label></div>
<p id="status" role="status">Preparing test party…</p><div id="results"></div><iframe id="widget" title="D&D dashboard" src="/test-widget"></iframe>
<script>
const frame=document.getElementById('widget'),results=[],calls=[],messages=[];let fixture,initialized=false,nextId=1000;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){for(let i=0;i<120;i++){if(await fn())return;await wait(80)}throw Error('Timed out')}
async function mcp(name,args={}){const r=await fetch('/test-rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:nextId++,method:'tools/call',params:{name,arguments:args}})});return(await r.json()).result}
window.addEventListener('message',async event=>{if(event.source!==frame.contentWindow||event.data?.jsonrpc!=='2.0')return;const m=event.data;if(m.method==='ui/notifications/initialized'){initialized=true;return}if(m.id===undefined)return;let result,error;try{if(m.method==='ui/initialize')result={protocolVersion:'2026-01-26',hostInfo:{name:'D&D local acceptance',version:'1'},hostCapabilities:{serverTools:{},message:{text:{}}},hostContext:{theme:'dark',displayMode:'inline',availableDisplayModes:['inline','fullscreen']}};else if(m.method==='tools/call'){calls.push(m.params.name);result=await mcp(m.params.name,m.params.arguments)}else if(m.method==='ui/update-model-context')result={};else if(m.method==='ui/message'){messages.push(m.params.content.map(x=>x.text).join(''));result={}}else if(m.method==='ui/request-display-mode')result={mode:'inline'};else result={}}catch(e){error={code:-32000,message:e.message}}frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,...(error?{error}:{result})},location.origin)});
const assert=(value,message)=>{if(!value)throw Error(message)};
async function check(name,fn){try{await fn();results.push({name,passed:true})}catch(e){results.push({name,passed:false,error:e.message})}const r=results.at(-1),line=document.createElement('p');line.className=r.passed?'pass':'fail';line.textContent=(r.passed?'PASS ':'FAIL ')+name+(r.error?' — '+r.error:'');document.getElementById('results').append(line)}
document.getElementById('width').onchange=e=>frame.style.width=e.target.value;
document.getElementById('layout').onchange=e=>frame.contentWindow.selectLayout(e.target.value,false);
(async()=>{fixture=await(await fetch('/test-dnd-fixture',{method:'POST'})).json();await until(()=>initialized);const output=await mcp('render_dashboard',{campaign_id:fixture.campaign.id});frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:output},location.origin);await until(()=>frame.contentDocument.querySelector('.dnd-sheet h3'));document.getElementById('status').textContent='Ready. View the sheet or run checks.';if(location.search.includes('autorun'))document.getElementById('run').click()})().catch(e=>document.getElementById('status').textContent=e.message);
document.getElementById('run').onclick=async()=>{const button=document.getElementById('run');button.disabled=true;const doc=frame.contentDocument,win=frame.contentWindow;await check('Familiar sheet structure and six correct ability modifiers',()=>{assert(doc.querySelectorAll('.dnd-ability').length===6,'Missing ability boxes');assert(doc.querySelector('.dnd-modifier').textContent==='+3','Wrong Strength modifier');assert(doc.querySelector('.dnd-sheet').textContent.includes('Armor Class'),'Missing armor class');assert(!doc.querySelector('.dnd-sheet').textContent.includes('LCK'),'Homebrew stat leaked')});await check('Your story collapses and expands with padding',()=>{const story=doc.querySelector('.dnd-story');assert(!story.open,'Story should start collapsed');story.querySelector('summary').click();assert(story.open,'Story did not expand');assert(parseFloat(win.getComputedStyle(story.querySelector('.story-copy')).paddingLeft)>=14,'Missing story padding');story.open=false});await check('Readable at narrow and wide widths in every layout',async()=>{for(const layout of ['original','reclaimed','orrery','ember'])for(const width of [375,768,1200]){frame.style.width=width+'px';win.selectLayout(layout,false);await wait(80);assert(doc.documentElement.scrollWidth<=win.innerWidth+1,layout+' overflows at '+width);assert(doc.querySelectorAll('.dnd-ability').length===6,'Lost ability boxes')}frame.style.width='100%';win.selectLayout('original',false)});await check('Companion has its own complete spellcasting sheet',()=>{const select=doc.querySelector('select[aria-label="Character sheet to view"]');select.value='test-iria';select.dispatchEvent(new win.Event('change'));assert(doc.querySelector('.dnd-sheet h3').textContent==='Iria','Companion sheet did not open');doc.getElementById('nav-skills').click();assert(doc.getElementById('skills').textContent.includes('Magic Missile'),'Missing companion spells');assert(doc.getElementById('skills').textContent.includes('Spell save DC'),'Missing spellcasting math')});await check('Feature details use conditional level progression',()=>{const tabs=[...doc.querySelectorAll('#skills [role=tab]')];assert(tabs.length>=2,'Missing feature tabs');tabs.find(b=>b.textContent==='Full rules').click();assert(doc.querySelector('#skills [role=tab][aria-selected=true]').textContent==='Full rules','Tab did not switch')});await check('D&D wallpaper groups, copyright and independent game choices',async()=>{
  const picker=doc.getElementById('sceneSelect');
  assert([...picker.querySelectorAll('optgroup')].map(g=>g.label).join('|')==='D&D wallpapers|Reading atmospheres','Missing wallpaper divider');
  assert(picker.querySelectorAll('optgroup[label="D&D wallpapers"] option').length===15,'Expected fifteen official artworks');
  win.selectScene('dnd-dalelands',false);
  assert(doc.getElementById('artCredit').textContent.includes('Maihope'),'Missing artist');
  assert(doc.getElementById('artCredit').textContent.includes('© Wizards'),'Missing copyright');
  const artUrl=win.getComputedStyle(doc.documentElement).getPropertyValue('--scene-art').trim().slice(4,-1).replaceAll(String.fromCharCode(34),'');
  const art=new win.Image();art.src=artUrl;await art.decode();
  assert(art.naturalWidth===4000&&art.naturalHeight===1403,'Wallpaper is not the full-resolution original');
  assert(artUrl.includes('/assets/backgrounds/'),'Artwork is not served separately');
  for(const item of picker.querySelectorAll('optgroup[label="D&D wallpapers"] option')){
    win.selectScene(item.value,false);
    const url=win.getComputedStyle(doc.documentElement).getPropertyValue('--scene-art').trim().slice(4,-1).replaceAll(String.fromCharCode(34),'');
    const image=new win.Image();image.src=url;await image.decode();
    assert(image.naturalWidth>=1920&&image.naturalHeight>=1080,'Low-resolution or missing artwork: '+item.textContent);
  }
  win.selectScene('dnd-dalelands',false);
  for(const game of ['age-of-convergence','sovereign-system']){
    win.activateGame(game);
    assert(!picker.querySelector('optgroup[label="D&D wallpapers"]'),'D&D choices leaked into '+game);
    assert(doc.documentElement.dataset.scene==='classic','Official artwork retained in '+game);
  }
  win.selectScene('glowwood',false);
  win.activateGame('dnd-2024');
  assert(picker.value==='dnd-dalelands','D&D background was not remembered');
  win.activateGame('sovereign-system');
  assert(picker.value==='glowwood','Sovereign background was not remembered');
  win.activateGame('dnd-2024');
});await check('No redundant dashboard composer',()=>{assert(!doc.getElementById('customForm')&&!doc.getElementById('send'),'Composer still present')});await check('Search finds companion spells',async()=>{const search=doc.getElementById('dashboardSearch');search.value='Magic Missile';search.dispatchEvent(new win.Event('input'));await wait(100);assert(doc.getElementById('dashboardSearchList').textContent.includes('Magic Missile'),'Spell missing from search');const hit=[...doc.querySelectorAll('#dashboardSearchList button')].find(b=>b.textContent.includes('Magic Missile'));assert(hit,'Missing result control');hit.click();assert(doc.getElementById('skills').textContent.includes('Spell save DC'),'Spellcasting did not open');doc.getElementById('dashboardSearchClear').click()});await check('Party controls open each full sheet',()=>{doc.getElementById('nav-summons').click();assert(doc.querySelectorAll('.dnd-party-member').length===2,'Missing party member');doc.querySelector('.dnd-party-member button').click();assert(!doc.getElementById('page-character').hidden,'Sheet not visible');assert(doc.querySelector('.dnd-sheet h3').textContent==='Mira','Wrong party sheet')});await check('Library loads owned saved characters',async()=>{doc.getElementById('nav-library').click();await until(()=>doc.querySelector('#library .dnd-library-card'));assert(doc.getElementById('library').textContent.includes('Mira'),'Saved character absent')});await check('Adventure starter is playable without uploads',async()=>{doc.getElementById('nav-adventures').click();await until(()=>doc.querySelector('#adventures .dnd-library-card'));assert(doc.getElementById('adventures').textContent.includes('Frozen Sick'),'Missing published starter');const play=[...doc.querySelectorAll('#adventures button')].find(b=>b.textContent==='Play Frozen Sick');assert(play,'Missing play control');play.click();await until(()=>messages.some(m=>m.includes('Play Frozen Sick')));assert(doc.getElementById('adventures').textContent.includes('Ready to play'),'Starter is not ready');assert(!doc.getElementById('adventures').textContent.includes('authorised adventure pack'),'Upload requirement remains');assert(!doc.body.textContent.includes('PRIVATE_TEST_SECRET'),'GM secret leaked')});await check('Game switching preserves homebrew stats and separates saves',async()=>{await win.switchGame('age-of-convergence');const original=await mcp('render_dashboard',{game_id:'age-of-convergence'});win.receive(original,true);await until(()=>doc.querySelector('#character .stat'));assert(doc.getElementById('character').textContent.includes('LCK'),'Age stats changed');assert(doc.getElementById('nav-library').hidden,'D&D library visible in homebrew');await win.switchGame('dnd-2024');win.receive(await mcp('render_dashboard',{campaign_id:fixture.campaign.id}),true);assert(doc.querySelectorAll('.dnd-ability').length===6,'D&D sheet not restored')});await check('Browsing performs no character mutation or gameplay advance',async()=>{const result=await mcp('get_campaign',{campaign_id:fixture.campaign.id}),state=result.structuredContent.campaign;assert(state.version===fixture.campaign.version,'Browsing changed campaign version');assert(state.fictional_time_seconds===0,'Browsing advanced time')});doc.getElementById('nav-character').click();document.getElementById('status').textContent=results.filter(r=>r.passed).length+' / '+results.length+' checks passed';await fetch('/test-dnd-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({results,calls,messages})})};
</script></html>

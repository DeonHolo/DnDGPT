<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DnDGPT · Continuity and recovery checks</title>
<style>body{font:14px system-ui;background:#101510;color:#eee;margin:20px}iframe{display:block;width:1180px;height:900px;border:1px solid #65705e}pre{white-space:pre-wrap}button{padding:10px}</style>
<h1>Continuity and recovery · disposable campaigns</h1><p>Real local tool transport inside a simulated host. No real player campaign or model call.</p>
<button id="run">Run layout and recovery checks</button><p id="summary" role="status">Ready</p><pre id="results"></pre>
<iframe id="widget" title="Disposable campaign dashboard" src="/test-widget"></iframe>
<script>
const frame=document.getElementById('widget'),results=[],calls=[],messages=[];let initialized=false,nextId=9000,active,exported;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(value,message)=>{if(!value)throw Error(message)};
async function until(fn,label='dashboard'){for(let i=0;i<160;i++){if(await fn())return;await sleep(100)}throw Error('Timed out: '+label)}
async function rpc(name,args={}){const started=performance.now();const response=await fetch('/test-rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:nextId++,method:'tools/call',params:{name,arguments:args}})});const body=await response.json();if(body.error)throw Error(body.error.message);if(body.result.isError)throw Error(body.result.content?.[0]?.text||'Tool rejected');calls.push({name,ms:Math.round(performance.now()-started)});if(name==='export_campaign')exported=body.result.structuredContent.archive;return body.result}
async function current(){return(await rpc('get_campaign',{campaign_id:active.id})).structuredContent.campaign}
function deliver(result){frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:result},location.origin)}
window.addEventListener('message',async event=>{
 if(event.source!==frame.contentWindow||event.data?.jsonrpc!=='2.0')return;
 const m=event.data;if(m.method==='ui/notifications/initialized'){initialized=true;return}if(m.id===undefined)return;
 let result,error;
 try{
  if(m.method==='ui/initialize')result={protocolVersion:'2026-01-26',hostCapabilities:{serverTools:{},message:{text:{}}},hostContext:{theme:'dark',displayMode:'inline'}};
  else if(m.method==='tools/call')result=await rpc(m.params.name,m.params.name==='render_dashboard'&&active&&!m.params.arguments?.campaign_id?{campaign_id:active.id}:m.params.arguments);
  else if(m.method==='ui/message'){messages.push(m.params);result={}}
  else throw Error('Unsupported test host method: '+m.method);
 }catch(e){error={code:-32000,message:e.message}}
 frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,...(error?{error}:{result})},location.origin);
});
async function test(name,run){try{await run();results.push({name,passed:true})}catch(error){results.push({name,passed:false,error:error.message,notice:frame.contentDocument?.getElementById('notice')?.textContent})}document.getElementById('results').textContent=results.map(r=>(r.passed?'PASS ':'FAIL ')+r.name+(r.error?': '+r.error:'')).join('\n')}
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;await until(()=>initialized);
 active=(await(await fetch('/test-continuity-fixture',{method:'POST'})).json()).campaign;
 deliver(await rpc('render_dashboard',{campaign_id:active.id}));const doc=frame.contentDocument;
 await until(()=>doc.getElementById('hero').textContent.includes('Continuity Test Scribe'));
 const before=await current();
 for(const width of [390,1180])for(const layout of ['original','reclaimed','orrery','ember'])await test(layout+' at '+width+'px: approval, story spacing, all ability tabs and chapters',async()=>{
  frame.style.width=width+'px';doc.getElementById('viewSettings').open=true;
  const select=doc.getElementById('layoutSelect');select.value=layout;select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));await sleep(100);
  assert(frame.contentWindow.innerWidth===width,'Viewport mismatch');
  assert(!doc.getElementById('approval').hidden&&!doc.getElementById('confirm').disabled,'Confirmation missing');
  assert(doc.getElementById('confirm').textContent==='Confirm character','Wrong approval control');
  assert(doc.getElementById('deleteCampaign').textContent.trim()==='Delete Campaign','Delete label changed');
  doc.getElementById('nav-character').click();const story=doc.querySelector('.character-story');
  assert(story&&!story.open,'Story must start collapsed');story.open=true;
  const style=frame.contentWindow.getComputedStyle(story),copy=story.querySelector('.story-copy')||story.querySelector('p'),copyStyle=frame.contentWindow.getComputedStyle(copy);
  assert(parseFloat(copyStyle.paddingLeft)>=12&&parseFloat(copyStyle.paddingRight)>=12,'Story padding missing');
  for(const side of ['Top','Right','Bottom','Left'])assert(parseFloat(style['border'+side+'Width'])>=1,'Story border missing: '+side);
  assert(copy.querySelector('p').getBoundingClientRect().left>story.getBoundingClientRect().left+12,'Story text touches edge');story.open=false;
  doc.getElementById('nav-skills').click();doc.getElementById('skill-tab-utility').click();
  const article=doc.querySelector('#skill-page-utility .reading-article');assert(article,'Utility ability missing');
  for(const key of ['overview','rules','upgrades']){const tab=article.querySelector('[id^="ability-view-'+key+'-"]');assert(tab,'Missing '+key);tab.click();assert(tab.getAttribute('aria-selected')==='true'&&!doc.getElementById(tab.getAttribute('aria-controls')).hidden,'Inaccessible '+key)}
  const chapters=[...doc.querySelectorAll('#sectionNav button')];assert(chapters.length===7,'Canonical chapter count');for(const button of chapters){button.click();assert(button.getAttribute('aria-current')==='page','Chapter inaccessible')}
  assert(doc.documentElement.scrollWidth<=width+1,'Horizontal page overflow');
 });
 await test('Opening resume and history is read-only and keeps the current save',async()=>{
  doc.getElementById('viewSettings').open=true;doc.getElementById('saveTools').open=true;
  assert(doc.getElementById('resumeBrief').textContent.includes('The pin is bent'),'Resume outcome missing');
  doc.getElementById('loadHistory').click();await until(()=>doc.querySelectorAll('#historyList button').length>=3);
  doc.querySelectorAll('#historyList button')[1].click();await until(()=>doc.querySelectorAll('#historyChanges .save-change').length>0);
  assert(JSON.stringify(await current())===JSON.stringify(before),'History/resume changed current campaign');
 });
 await test('Correction preview is exact, approved once and sends no extra GM turn',async()=>{
  const select=doc.getElementById('correctionField');select.value='character.story_summary';select.dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
  const text='A fully reviewable correction. '+('The saved story remains visible for player review. '.repeat(35))+'END OF CORRECTION';
  doc.getElementById('correctionValue').value=text;doc.getElementById('correctionReason').value='Browser fixture correction';doc.getElementById('correctionPreview').click();
  await until(()=>doc.getElementById('confirm').textContent==='Approve correction'&&!doc.getElementById('confirm').disabled);
  assert(doc.getElementById('approvalChanges').textContent.includes('END OF CORRECTION'),'Correction was truncated before approval');
  assert(JSON.stringify(await current())===JSON.stringify(before),'Preview mutated save');const sent=messages.length;
  doc.getElementById('confirm').click();await until(async()=>(await current()).version===before.version+1);await sleep(200);
  const after=await current();assert(after.character.story_summary===text&&after.paused&&after.fictional_time_seconds===before.fictional_time_seconds,'Incorrect correction commit');assert(messages.length===sent,'Correction triggered extra GM turn');active=after;
 });
 await test('Campaign export and file preview restore a separate paused copy',async()=>{
  doc.getElementById('downloadCampaign').click();await until(()=>exported&&doc.querySelector('#exportDownload a'));
  assert(JSON.stringify(JSON.parse(doc.querySelector('#exportDownload textarea').value))===JSON.stringify(exported),'Copyable export differs from file data');
  const source=await current(),dt=new frame.contentWindow.DataTransfer();dt.items.add(new frame.contentWindow.File([JSON.stringify(exported)],'fixture.dndgpt.json',{type:'application/json'}));
  doc.getElementById('campaignFile').files=dt.files;doc.getElementById('campaignFile').dispatchEvent(new frame.contentWindow.Event('change',{bubbles:true}));
  await until(()=>!doc.getElementById('importReview').hidden);assert(JSON.stringify(await current())===JSON.stringify(source),'Preview changed source');doc.getElementById('confirmImport').click();
  await until(()=>doc.getElementById('notice').textContent.includes('Restored a separate paused campaign'));
  const result=(await rpc('list_campaigns')).structuredContent.campaigns.find(row=>row.id!==active.id&&row.name.endsWith('(restored)'));
  assert(result,'Restored copy missing');const restored=(await rpc('get_campaign',{campaign_id:result.id})).structuredContent.campaign;
  assert(restored.paused&&restored.id!==source.id&&restored.character.story_summary===source.character.story_summary,'Unsafe restoration');assert(JSON.stringify(await current())===JSON.stringify(source),'Source was overwritten');
 });
 const passed=results.every(r=>r.passed);document.getElementById('summary').textContent=results.filter(r=>r.passed).length+'/'+results.length+' passed';
 await fetch('/test-continuity-record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passed,results,calls,layouts:['original','reclaimed','orrery','ember'],widths:[390,1180],model_calls:0})});
};
</script></html>

<h1>DnDGPT 1.0 · MCP App interaction tests</h1>
<p><strong>Simulated host, disposable fixtures.</strong> This page is not ChatGPT and does not establish real PiP or OAuth sign-in support.</p>
<button id="run">Run interaction tests</button><p id="summary" role="status">Waiting for app initialization…</p>
<main><iframe id="widget" title="DnDGPT test widget" src="/test-widget"></iframe><div><h2>Test results</h2><pre id="results"></pre><h2>Simulated chat messages</h2><div id="chat"></div></div></main>
<script>
const frame=document.getElementById("widget"),messages=[],results=[],calls=[];
let initialized=0,nextId=1000;
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(test){for(let n=0;n<120;n++){if(await test())return;await sleep(100)}throw new Error("Timed out waiting for UI")}
async function snapshot(){return(await fetch("/test-state")).json()}
async function availability(available){await fetch("/test-availability",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({available})})}
async function mcp(name,args={}){const response=await fetch("/test-rpc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:nextId++,method:"tools/call",params:{name,arguments:args}})});const data=await response.json();if(data.error)throw new Error(data.error.message);return data.result}
window.addEventListener("message",async event=>{
 if(event.source!==frame.contentWindow||event.data?.jsonrpc!=="2.0")return;
 const m=event.data;if(m.method==="ui/notifications/initialized"){initialized++;document.getElementById("summary").textContent="App initialized · ready for tests";return}
 if(m.id===undefined)return;
 let result,error;
 try{
  if(m.method==="ui/initialize")result={protocolVersion:"2026-01-26",hostInfo:{name:"DnDGPT test host",version:"1.0.0"},hostCapabilities:{serverTools:{},message:{text:{}}},hostContext:{theme:"light",displayMode:"inline",availableDisplayModes:["inline","pip","fullscreen"]}};
  else if(m.method==="tools/call"){calls.push(m.params.name);const response=await fetch("/test-rpc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(m)});const body=await response.json();if(body.error)throw new Error(body.error.message);result=body.result}
  else if(m.method==="ui/message"){if(!Array.isArray(m.params.content))throw new Error("content must be content blocks");messages.push(m.params.content.map(c=>c.text||"").join(""));const p=document.createElement("p");p.textContent=messages.at(-1);document.getElementById("chat").append(p);result={}}
  else if(m.method==="ui/request-display-mode")result={mode:"inline"};
  else throw new Error("Unsupported host method: "+m.method);
 }catch(e){error={code:-32000,message:e.message}}
 frame.contentWindow.postMessage({jsonrpc:"2.0",id:m.id,...(error?{error}:{result})},location.origin);
});
function assert(test,message){if(!test)throw new Error(message)}
function report(name,error){results.push({name,passed:!error,...(error?{error:error.message}:{})});const row=document.createElement("div");row.className=error?"fail":"pass";row.textContent=(error?"FAIL ":"PASS ")+name+(error?": "+error.message:"");document.getElementById("results").append(row)}
async function test(name,run){try{await run();report(name)}catch(e){report(name,e)}}
document.getElementById("run").onclick=async()=>{
 document.getElementById("run").disabled=true;
 await until(()=>frame.contentDocument?.getElementById("hero")?.textContent.includes("UI test fixture"));
 let doc=frame.contentDocument;const before=await snapshot();
 await test("Seven canonical navigation pages; choices above codex",async()=>{
  const panels=[...doc.querySelectorAll("#hud [data-panel]")];assert(panels.length===7,"Page count differs");
  assert(panels.map(p=>p.dataset.panel).join(",")==="character,skills,health,summons,equipment,quests,world","Canonical panel order changed");
  assert(doc.getElementById("choices").children.length>=3,"Missing action choices");
  assert(Boolean(doc.getElementById("choices").compareDocumentPosition(doc.getElementById("hud"))&Node.DOCUMENT_POSITION_FOLLOWING),"Choices are below HUD");
 });
 await test("Resource meters and navigation summaries reflect authoritative state",async()=>{
  const character=before.campaign.character,meters=[...doc.querySelectorAll("#resources meter")];
  assert(meters.length===3,"Missing resource meters");
  for(const [index,key]of ["hp","mp","sta"].entries()){
   assert(meters[index].value===character[key]&&meters[index].max===character[key+"_max"],"Resource value differs from server state");
   assert(meters[index].getAttribute("aria-label")===key.toUpperCase(),"Resource is not labeled");
  }
  assert(doc.getElementById("skillsPreview").textContent===before.campaign.abilities.length+" owned · 0 ready","Unavailable fixture was presented as ready");
  assert(doc.getElementById("worldPreview").textContent===before.campaign.current_location,"Location summary differs from state");
  assert(doc.getElementById("characterPreview").textContent.includes("XP "+character.xp+" / "+character.xp_next),"Character navigation lacks authoritative XP");
  assert(doc.getElementById("xpMeter").value===character.xp&&doc.getElementById("xpMeter").max===character.xp_next,"XP meter differs from state");
  assert([...doc.querySelectorAll(".panel-preview")].length===7,"A canonical group lacks its summary");
 });
 await test("All seven buttons open one full page locally without chat or remount",async()=>{
  const count=initialized,chatCount=messages.length;
  const buttons=[...doc.querySelectorAll("#sectionNav button")];assert(buttons.length===7,"Missing navigation buttons");
  for(const button of buttons){
   button.click();
   const visible=[...doc.querySelectorAll("#hud [data-panel]")].filter(p=>!p.hidden);
   assert(visible.length===1&&visible[0].dataset.panel===button.dataset.target,"Navigation did not select exactly its page");
   assert(doc.querySelectorAll('#sectionNav [aria-current="page"]').length===1,"Active navigation is ambiguous");
   assert(doc.getElementById(button.getAttribute("aria-controls"))===visible[0],"Accessible control target differs from displayed page");
   assert(button.getBoundingClientRect().height>=44,"Navigation touch target is too small");
  }
  assert(initialized===count&&messages.length===chatCount,"Inspecting a chapter remounted the view or sent a chat message");
 });

 await test("Codex text and control boundaries retain contrast in both themes",async()=>{
  const probe=doc.createElement("span");probe.hidden=true;doc.body.append(probe);
  const rgb=value=>{probe.style.color=value;return frame.contentWindow.getComputedStyle(probe).color.match(/[\d.]+/g).slice(0,3).map(Number)};
  const luminance=values=>values.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((sum,v,i)=>sum+v*[.2126,.7152,.0722][i],0);
  const ratio=(a,b)=>{const x=luminance(rgb("var("+a+")")),y=luminance(rgb("var("+b+")"));return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
  try{for(const theme of ["light","dark"]){
   frame.contentWindow.postMessage({jsonrpc:"2.0",method:"ui/notifications/host-context-changed",params:{theme}},location.origin);
   await until(()=>doc.documentElement.style.colorScheme===theme);
   for(const text of ["--ink","--muted","--gold","--hp","--mp","--sta"])
    for(const surface of ["--paper","--soft"])assert(ratio(text,surface)>=4.5,text+" has low text contrast in "+theme);
   assert(ratio("--line","--paper")>=3,"Control border has low contrast in "+theme);
   assert(ratio("--muted","--gold-wash")>=4.5,"Active navigation summary has low contrast in "+theme);
  }}finally{probe.remove()}
 });

 await test("Skill subtabs isolate groups and preserve nested details without gameplay changes",async()=>{
  const chatCount=messages.length,viewCount=initialized;
  const tabs=[...doc.querySelectorAll('#skillTabs [role="tab"]')];
  assert(tabs.length===4,"Missing ability subtabs");
  const expected=[["combat","fixture-bolt"],["reactions","fixture-guard"],["passives","fixture-passive"],["utility","fixture-survey"]];
  for(const [id,ability]of expected){
   const button=doc.getElementById("skill-tab-"+id);button.click();
   const visible=[...doc.querySelectorAll("[data-skill-page]")].filter(page=>!page.hidden);
   assert(visible.length===1&&visible[0].dataset.skillPage===id,"Skill tab revealed the wrong group");
   assert(visible[0].querySelector('[data-detail="ability-'+ability+'"]'),"Owned ability is in the wrong group");
   assert(button.getAttribute("aria-selected")==="true"&&button.tabIndex===0,"Selected skill tab is not exposed");
   assert(button.textContent.includes("1"),"Skill count differs from owned abilities");
   assert(tabs.filter(tab=>tab.tabIndex===0).length===1,"Tab order includes inactive skill tabs");
   assert(doc.getElementById(button.getAttribute("aria-controls"))===visible[0],"Skill tab controls another page");
   assert(button.getBoundingClientRect().height>=44,"Skill tab touch target too small");
   for(const width of [340,480,640,1024]){
    frame.style.width=width+"px";await sleep(40);
    assert(doc.documentElement.scrollWidth<=frame.contentWindow.innerWidth+1,"Skill tabs overflow at "+width);
   }
  }
  frame.style.width="";
  doc.getElementById("nav-character").click();doc.getElementById("nav-skills").click();
  assert(!doc.getElementById("skill-page-utility").hidden,"Chapter navigation lost skill subtab");
  assert(doc.querySelector('[data-detail="child-fixture-bolt-fixture-evolution"]').open,"Subtab switch lost nested expansion");
  await sleep(900);const after=await snapshot();
  assert(after.preferences.skills_tab==="utility","Skill subtab preference was not saved");
  assert(JSON.stringify(after.campaign)===JSON.stringify(before.campaign)&&after.audit.event_count===before.audit.event_count,"Skill inspection mutated gameplay");
  assert(initialized===viewCount&&messages.length===chatCount,"Skill inspection remounted UI or sent chat");
 });
 await test("Skill subtabs support keyboard selection and preserve browser shortcuts",async()=>{
  const last=doc.getElementById("skill-tab-utility");last.focus();
  const key=value=>doc.activeElement.dispatchEvent(new frame.contentWindow.KeyboardEvent("keydown",{key:value,bubbles:true,cancelable:true}));

  key("Home");assert(!doc.getElementById("skill-page-combat").hidden,"Home did not select Combat");
  key("End");assert(!doc.getElementById("skill-page-utility").hidden,"End did not select Utility");
  const modified=new frame.contentWindow.KeyboardEvent("keydown",{key:"Home",ctrlKey:true,bubbles:true,cancelable:true});
  doc.activeElement.dispatchEvent(modified);

 await test("Equipment and Inventory tabs inspect gear without exposing hidden rolls",async()=>{
  const count=messages.length,viewCount=initialized;
  doc.getElementById("nav-equipment").click();
  assert(doc.querySelectorAll('#gearTabs [role="tab"]').length===2,"Missing gear subtabs");
  assert(!doc.getElementById("gear-equipment").hidden&&doc.getElementById("gear-inventory").hidden,"Equipment tab did not open by default");
  const worn=doc.querySelectorAll("#gear-equipment .item-card");
  assert(worn.length===1,"Two-handed item was duplicated");
  assert(doc.getElementById("equipmentPreview").textContent==="1 equipped · 3 stored items","Gear navigation counts include worn duplicates");
  assert(doc.querySelector(".item-slot").textContent.includes("Main Hand · Off-Hand"),"Occupied hand slots not combined");
  assert(doc.querySelectorAll(".empty-slot").length===14,"Canonical empty slots were lost");
  worn[0].querySelector("summary").click();await until(()=>worn[0].open);
  assert(worn[0].textContent.includes("STR 5")&&worn[0].textContent.includes("2.4 kg"),"Recorded details are missing");
  const first=doc.getElementById("tab-equipment");first.focus();
  first.dispatchEvent(new frame.contentWindow.KeyboardEvent("keydown",{key:"ArrowRight",bubbles:true,cancelable:true}));
  assert(doc.activeElement===doc.getElementById("tab-inventory")&&!doc.getElementById("gear-inventory").hidden,"Keyboard subtab selection failed");
  assert(doc.getElementById("tab-inventory").getAttribute("aria-selected")==="true"&&doc.getElementById("tab-equipment").tabIndex===-1,"Tab semantics do not match selection");
  const stored=doc.querySelectorAll("#gear-inventory .item-card");
  stored[0].querySelector("summary").click();await until(()=>stored[0].open);
  assert([...stored[0].querySelectorAll("dt")].some(label=>label.textContent==="Remaining"&&label.nextElementSibling.textContent==="0"),"Zero charges were omitted");
  assert(stored[1].textContent.includes("More details have not been recorded."),"Missing details were invented");
  assert(doc.querySelector("#gear-inventory .supply-list").textContent.includes("Qty 3"),"Supplies ledger missing");
  assert(!doc.getElementById("equipment").textContent.includes("PRIVATE_RARITY_RECEIPT")&&!doc.getElementById("equipment").textContent.includes("HIDDEN_NESTED_RECEIPT"),"Hidden receipts leaked through item details");
  assert(!doc.querySelector("#equipment img, #equipment script"),"Untrusted item markup became executable HTML");
  assert(stored[2].textContent.includes("<img src=x"),"Untrusted item name was lost");
  doc.getElementById("nav-character").click();doc.getElementById("nav-equipment").click();
  assert(!doc.getElementById("gear-inventory").hidden&&stored[0].open,"Chapter navigation lost the subtab or detail");
  for(const width of [340,480,640,1024]){
    frame.style.width=width+"px";await sleep(60);
    assert(doc.documentElement.scrollWidth<=frame.contentWindow.innerWidth+1,"Populated inventory overflows at "+width);
  }
  frame.style.width="";
  await sleep(900);
  const after=await snapshot();
  assert(after.preferences.equipment_tab==="inventory","Inventory subtab was not saved");
  assert(JSON.stringify(after.campaign)===JSON.stringify(before.campaign)&&after.audit.event_count===before.audit.event_count,"Item inspection changed game state");
  assert(initialized===viewCount&&messages.length===count,"Item inspection remounted UI or sent chat");
  doc.getElementById("nav-skills").click();
 });

 await test("Lost connection retains the snapshot and blocks approval until recovery",async()=>{
  const version=(await snapshot()).campaign.version,chapter=doc.querySelector('#sectionNav [aria-current="page"]');
  const cached=await mcp("get_campaign",{campaign_id:before.campaign.id});
  assert(doc.getElementById("syncStatus").dataset.state==="saved","Successful read was not marked saved");
  try{
   await availability(false);doc.getElementById("refresh").click();
   await until(()=>doc.getElementById("syncStatus").dataset.state==="stale");
   assert(doc.getElementById("syncStatus").textContent.includes("last saved snapshot"),"Lost connection was hidden");
   assert(doc.getElementById("confirm").disabled,"Unverified approval stayed enabled");
   frame.contentWindow.postMessage({jsonrpc:"2.0",method:"ui/notifications/tool-result",params:cached},location.origin);
   await sleep(50);
   assert(doc.getElementById("syncStatus").dataset.state==="stale"&&doc.getElementById("confirm").disabled,"Cached host output cleared the connection failure");
   assert(doc.getElementById("hero").textContent.includes("UI test fixture")&&chapter.getAttribute("aria-current")==="page","Snapshot or selected chapter disappeared");
   doc.getElementById("confirm").click();
   assert((await snapshot()).campaign.version===version,"Offline approval changed state");
  }finally{await availability(true)}
  doc.getElementById("refresh").click();
  await until(()=>doc.getElementById("syncStatus").dataset.state==="saved"&&!doc.getElementById("confirm").disabled);
  assert(doc.getElementById("notice").textContent.includes("Connection restored"),"Old connection error remained after recovery");
  assert((await snapshot()).campaign.version===version,"Reconnecting committed a pending action");
 });

 const display=structuredClone(savedBeforePresentation.campaign);display.mode="chat";display.phase="character_draft";display.version+=100;

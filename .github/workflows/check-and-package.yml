name: Check and package DnDGPT

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dndgpt-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dndgpt-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: dndgpt-app/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Check bundled documents match the hosted source
        run: python -m scripts.sync_plugin_rules --check
      - name: Check the isolated hosted runtime
        run: |
          python -m venv .test-tmp/hosted-runtime
          .test-tmp/hosted-runtime/bin/python -m pip install -r requirements-hosted.txt
          .test-tmp/hosted-runtime/bin/python -c "from app.server import create_app; from app.presentation import dashboard_html; from app.game_profiles import rule_source, SOVEREIGN; from PIL import features; assert features.check('webp'); assert 'galleryGrid' in dashboard_html(); assert len(rule_source(SOVEREIGN, 'hardener')['content']) < 8000"
      - name: Check rules, packaging, ownership and game behavior
        run: |
          python -c "from pathlib import Path; Path('.test-tmp').mkdir(exist_ok=True)"
          python -m pytest -q --basetemp=.test-tmp/ci
      - name: Build plugin with current rules and a portable MCP connection
        run: python -m scripts.build_portable_plugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dndgpt-plugin-${{ github.sha }}
          path: dist/dndgpt-portable.zip
          if-no-files-found: error
          retention-days: 14
